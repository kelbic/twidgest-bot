<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="https://twidgest.ru/">
<meta name="theme-color" content="#0b1220">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
<style>
:root {
  --bg: #0b1220;
  --bg-2: #0d1526;
  --card: #121c30;
  --card-2: #16233c;
  --text: #e9effc;
  --muted: #9db0cf;
  --line: rgba(148, 180, 255, .14);
  --blue: #2aabee;
  --violet: #8774e1;
  --grad: linear-gradient(135deg, #2aabee 0%, #8774e1 100%);
  --radius: 16px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background:
    radial-gradient(1200px 600px at 80% -100px, rgba(135, 116, 225, .18), transparent 60%),
    radial-gradient(900px 500px at 10% 0, rgba(42, 171, 238, .14), transparent 55%),
    var(--bg);
  color: var(--text);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { line-height: 1.2; margin: 0 0 .5em; }
h2 { font-size: clamp(1.6rem, 3.4vw, 2.2rem); font-weight: 800; letter-spacing: -.02em; }
h3 { font-size: 1.15rem; font-weight: 700; }
img { max-width: 100%; }
code {
  background: rgba(42, 171, 238, .12);
  border: 1px solid rgba(42, 171, 238, .18);
  color: #9fd8ff;
  padding: 1px 7px;
  border-radius: 7px;
  font-size: .88em;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  overflow-wrap: anywhere;
}

/* ---------- Навигация ---------- */
.nav {
  position: sticky; top: 0; z-index: 50;
  backdrop-filter: blur(14px);
  background: rgba(11, 18, 32, .75);
  border-bottom: 1px solid var(--line);
}
.nav-inner {
  max-width: 1080px; margin: 0 auto; padding: 12px 20px;
  display: flex; align-items: center; gap: 22px;
}
.logo {
  font-weight: 800; font-size: 1.15rem; color: var(--text) !important;
  letter-spacing: -.02em; display: flex; align-items: center; gap: 8px;
}
.logo:hover { text-decoration: none; }
.logo .bolt {
  background: var(--grad); width: 28px; height: 28px; border-radius: 8px;
  display: inline-flex; align-items: center; justify-content: center; font-size: .95rem;
}
.nav-links { display: flex; gap: 18px; margin-left: auto; }
.nav-links a { color: var(--muted); font-size: .95rem; }
.nav-links a:hover { color: var(--text); text-decoration: none; }
.nav .cta-btn { margin: 0; padding: 9px 18px; font-size: .95rem; }
@media (max-width: 820px) { .nav-links { display: none; } .nav .cta-btn { margin-left: auto; } }

/* ---------- Кнопки ---------- */
.cta-btn {
  display: inline-block;
  background: var(--grad);
  color: #fff !important;
  padding: 14px 30px;
  border-radius: 12px;
  font-size: 1.05rem;
  font-weight: 700;
  margin: 8px;
  box-shadow: 0 10px 30px rgba(42, 171, 238, .35);
  transition: transform .15s ease, box-shadow .15s ease;
}
.cta-btn:hover { text-decoration: none; transform: translateY(-2px); box-shadow: 0 14px 36px rgba(42, 171, 238, .45); }
.cta-btn.secondary {
  background: rgba(148, 180, 255, .08);
  border: 1px solid var(--line);
  box-shadow: none;
  color: var(--text) !important;
}
.cta-btn.secondary:hover { background: rgba(148, 180, 255, .14); }

/* ---------- Hero ---------- */
.hero {
  max-width: 1080px; margin: 0 auto;
  padding: 72px 20px 40px;
  display: grid; grid-template-columns: 1.15fr .85fr; gap: 40px; align-items: center;
}
.hero-badge {
  display: inline-block; font-size: .85rem; color: #b8e2ff;
  border: 1px solid rgba(42, 171, 238, .35); background: rgba(42, 171, 238, .1);
  padding: 5px 14px; border-radius: 999px; margin-bottom: 18px;
}
.hero h1 {
  font-size: clamp(2.1rem, 5vw, 3.2rem);
  font-weight: 800; letter-spacing: -.03em; margin-bottom: .4em;
}
.hero h1 .accent {
  background: var(--grad);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero .subtitle { font-size: 1.15rem; color: var(--muted); max-width: 560px; margin: 0 0 1.6em; }
.hero-ctas { margin-left: -8px; }
.hero-stats { display: flex; gap: 26px; margin-top: 26px; flex-wrap: wrap; }
.hero-stat b { display: block; font-size: 1.25rem; letter-spacing: -.01em; }
.hero-stat span { color: var(--muted); font-size: .85rem; }

/* Мокап телеграм-постов */
.mockup { position: relative; min-height: 380px; }
.tg-post {
  background: #182533; border: 1px solid rgba(255, 255, 255, .07);
  border-radius: 14px; padding: 14px 16px; max-width: 340px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, .45);
  font-size: .92rem;
}
.tg-post.main { position: relative; z-index: 2; transform: rotate(-1.5deg); }
.tg-post.back {
  position: absolute; top: 190px; right: 0; z-index: 1; transform: rotate(2deg);
  max-width: 320px; opacity: .95;
}
.tg-head { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
.tg-ava {
  width: 38px; height: 38px; border-radius: 50%; background: var(--grad);
  display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0;
}
.tg-head b { display: block; font-size: .95rem; }
.tg-head span { color: #7d8fa5; font-size: .78rem; }
.tg-body { color: #dfe8f2; }
.tg-body .src { color: var(--blue); }
.tg-foot { color: #7d8fa5; font-size: .78rem; margin-top: 10px; display: flex; gap: 12px; }
@media (max-width: 900px) {
  .hero { grid-template-columns: 1fr; padding-top: 48px; }
  .mockup { min-height: 0; display: grid; gap: 16px; justify-content: center; }
  .tg-post.back { position: static; transform: rotate(1deg); }
  .tg-post.main { transform: none; }
}

/* ---------- Секции ---------- */
.section { max-width: 1080px; margin: 0 auto; padding: 64px 20px; }
.section.narrow { max-width: 860px; }
.eyebrow {
  text-transform: uppercase; letter-spacing: .14em; font-size: .78rem; font-weight: 700;
  background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  margin-bottom: 10px;
}
.section-sub { color: var(--muted); max-width: 640px; margin-top: -6px; }

/* Чипы тем */
.chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.chip {
  background: var(--card); border: 1px solid var(--line); border-radius: 999px;
  padding: 7px 16px; font-size: .92rem; color: #cdd9ef;
}

/* Шаги */
.steps { display: grid; gap: 16px; margin: 30px 0 0; }
.step {
  display: flex; gap: 16px; align-items: flex-start;
  padding: 20px 22px; background: var(--card);
  border: 1px solid var(--line); border-radius: var(--radius);
}
.step-num {
  background: var(--grad); color: #fff; width: 36px; height: 36px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center; font-weight: 800; flex-shrink: 0;
}
.step-text { flex: 1; color: var(--muted); }
.step-text strong { display: block; margin-bottom: 4px; color: var(--text); font-size: 1.02rem; }

/* Сетка фич */
.features {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px; margin-top: 30px;
}
.feature {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 22px; transition: transform .15s ease, border-color .15s ease;
}
.feature:hover { transform: translateY(-3px); border-color: rgba(42, 171, 238, .4); }
.feature .icon { font-size: 1.6rem; margin-bottom: 10px; display: block; }
.feature p { color: var(--muted); font-size: .95rem; margin: 6px 0 0; }
.feature .new {
  font-size: .7rem; font-weight: 800; letter-spacing: .08em; vertical-align: 2px;
  background: var(--grad); color: #fff; border-radius: 6px; padding: 2px 7px; margin-left: 8px;
}

/* Блок команд */
.cmd-card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 26px; margin-top: 26px;
}
.cmd-card p { margin: 0; color: var(--muted); }
.cmd-card code { display: inline-block; margin: 3px 0; }

/* Essayist */
.essayist-wrap {
  background: linear-gradient(160deg, rgba(135, 116, 225, .16), rgba(42, 171, 238, .07));
  border: 1px solid rgba(135, 116, 225, .3); border-radius: 24px; padding: 40px 34px;
}
.essayist-wrap .tag {
  font-size: .78rem; font-weight: 700; color: #cfc4ff; border: 1px solid rgba(135, 116, 225, .5);
  padding: 4px 12px; border-radius: 999px; display: inline-block; margin-bottom: 14px;
}
@media (max-width: 600px) { .essayist-wrap { padding: 28px 20px; } }

/* Тарифы */
.tiers {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 18px; margin: 34px 0 0;
}
.tier {
  border: 1px solid var(--line); background: var(--card);
  border-radius: 20px; padding: 28px 24px; text-align: left; position: relative;
}
.tier.featured {
  background:
    linear-gradient(var(--card-2), var(--card-2)) padding-box,
    var(--grad) border-box;
  border: 2px solid transparent;
}
.tier .badge {
  position: absolute; top: -12px; right: 18px;
  background: var(--grad); color: #fff; font-size: .72rem; font-weight: 800;
  letter-spacing: .06em; padding: 4px 12px; border-radius: 999px;
}
.tier h4 { margin: 0 0 6px; font-size: 1.05rem; color: var(--muted); font-weight: 600; }
.tier .price { font-size: 1.9rem; font-weight: 800; letter-spacing: -.02em; }
.tier .price small { font-size: .85rem; color: var(--muted); font-weight: 500; }
.tier .price-note { color: var(--muted); font-size: .88rem; margin: 2px 0 14px; }
.tier ul { list-style: none; padding: 0; margin: 0; font-size: .93rem; }
.tier ul li { padding: 6px 0 6px 26px; position: relative; color: #cdd9ef; }
.tier ul li::before { content: "✓"; position: absolute; left: 2px; color: var(--blue); font-weight: 700; }
.pay-note { text-align: center; color: var(--muted); font-size: .9rem; max-width: 620px; margin: 26px auto 0; }

/* FAQ */
.faq-item {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 4px 20px; margin-bottom: 10px;
}
.faq-item summary {
  font-weight: 600; cursor: pointer; padding: 14px 0; list-style: none;
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
}
.faq-item summary::-webkit-details-marker { display: none; }
.faq-item summary::after { content: "+"; color: var(--blue); font-size: 1.3rem; font-weight: 400; transition: transform .2s; }
.faq-item[open] summary::after { transform: rotate(45deg); }
.faq-item p { margin: 0 0 16px; color: var(--muted); }

/* Финальный CTA */
.final-cta {
  text-align: center;
  background: linear-gradient(160deg, rgba(42, 171, 238, .14), rgba(135, 116, 225, .14));
  border: 1px solid var(--line); border-radius: 24px; padding: 56px 24px;
}
.final-cta p { color: var(--muted); max-width: 560px; margin: 0 auto 10px; }

footer { text-align: center; padding: 44px 20px 60px; color: #6d7f9c; font-size: .9rem; }
footer a { color: #93a7c9; }
</style>
</head>
<body>

  <div class="nav-inner">

    <div class="nav-links">

      <a href="#faq">FAQ</a>

</nav>
